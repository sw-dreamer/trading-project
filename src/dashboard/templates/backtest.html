<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAC 트레이딩 시스템 - 백테스트 결과</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
  
  
</head>
<body>
  <!-- 네비게이션 바 -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">SAC 트레이딩 시스템</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/">대시보드</a></li>
          <li class="nav-item"><a class="nav-link" href="/live-trading">실시간 트레이딩</a></li>
          <li class="nav-item"><a class="nav-link" href="/live-chart">실시간 차트</a></li>
          <li class="nav-item"><a class="nav-link active" href="/backtest">백테스트 결과</a></li>
          <li class="nav-item"><a class="nav-link" href="/models">모델 관리</a></li>
          <li class="nav-item"><a class="nav-link" href="/news">관련 기사</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-4">

    <!-- 시스템 개요 -->
    <div class="row mb-3">
      <div class="col-md-12">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">백테스트 결과</h5>
            </div>
            <div class="card-body">
            <p>SAC 트레이딩 시스템을 백테스트하고 결과를 확인할 수 있습니다.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 모델 선택  id = modelSelect -->
    <div class="row mb-3">
      <!-- 모델 선택 -->
      <div class="col-md-3">
        <div class="card h-100">
          <div class="card-header">
            <h5 class="mb-0">모델 선택</h5>
          </div>
          <div class="card-body">
            <div class="custom-select-wrapper">
              <select id="modelSelect" class="form-control custom-select">
                <option value="">모델을 선택하세요</option>
              </select>
              <div class="custom-select-arrow">▼</div>
            </div>
          </div>
        </div>
      </div>
    
      <!-- 성능 요약 -->
      <div class="col-md-9">
        <div class="card h-100">
          <div class="card-header">
            <h5 class="mb-0">성능 요약</h5>
          </div>
          <div class="card-body">
            <div class="row text-center">
              <div class="col-md-3">
                <h6>총 수익률</h6>
                <p id="totalReturn">-</p>
              </div>
              <div class="col-md-3">
                <h6>샤프 비율</h6>
                <p id="sharpeRatio">-</p>
              </div>
              <div class="col-md-3">
                <h6>최대 낙폭</h6>
                <p id="maxDrawdown">-</p>
              </div>
              <div class="col-md-3">
                <h6>승률</h6>
                <p id="winRate">-</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
      
      <!-- 포트폴리오 가치 변화, 낙폭 변화 -->
<div class="row mb-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">포트폴리오 가치 변화(수정필요)</h5>
        </div>
        <div class="card-body">
          <div id="portfolioChart" style="height: 400px;"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">낙폭 변화(수정필요)</h5>
        </div>
        <div class="card-body">
          <div id="drawdownChart" style="height: 400px;"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 거래 분포, 모델 비교-->
  <div class="row mb-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">거래 분포 (수정필요)</h5>
        </div>
        <div class="card-body">
          <div id="tradeDistributionChart" style="height: 400px;"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">모델 비교</h5>
        </div>
        <div class="card-body">
          <div id="modelComparisonChart" style="height: 400px;"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 거래 내역 -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">거래 내역</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped text-white" id="tradesTable">
          <thead>
            <tr>
              <th>날짜/시간</th>
              <th>종류</th>
              <th>가격</th>
              <th>수량</th>
              <th>비용</th>
              <th>포트폴리오 가치</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  
    

  <!-- 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="/static/js/backtest.js"></script>
</body>
</html>
